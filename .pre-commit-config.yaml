# Run: uv run pre-commit install   (once; then on every commit)
#      uv run pre-commit run --all-files
# Nix isn't installed on the workstation; `uv run just nix-check` is the Nix gate.
exclude: ^(nix/flake\.lock|uv\.lock)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^platform/substrate/kube-ax\.patch$
      - id: end-of-file-fixer
        exclude: ^platform/substrate/kube-ax\.patch$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -c, .yamllint.yaml]
        exclude: ^kubeconfig/   # generated by kubectl/k3s

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        args: [--fix]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: no-secrets
        name: block files under secrets/
        entry: scripts/check-no-secrets.sh
        language: script
        files: ^secrets/
      - id: go
        name: gofmt + go vet (tools/egress-watcher)
        entry: scripts/check-go.sh
        language: script
        files: ^tools/egress-watcher/
        pass_filenames: false
