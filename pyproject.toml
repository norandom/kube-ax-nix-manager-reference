[project]
name = "kube-ax-nix-manager"
version = "0.1.0"
description = "pyinfra-driven NixOS + k3s + Agent Substrate/AX cluster for small Proxmox VMs"
requires-python = ">=3.14"
dependencies = [
    "pyinfra>=3.10,<4",
    "rust-just>=1.58",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6",
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
