# Relabel regexes below are copied verbatim from the chart and can't be wrapped.
# yamllint disable rule:line-length
# Sizing overlay for the openobserve/openobserve-collector chart (Requirement 12, 17).
# Upstream leaves agent/gateway without requests/limits and lets memory_limiter grow to
# 512 MiB per node / 1 GiB for the gateway; on 6 GiB nodes that is most of the headroom.
# memory_limiter stays ~80% of the container limit so the collector sheds load before OOM.
#
# Streams: nothing goes to OpenObserve's `default` streams. Logs -> k3s_logs, traces ->
# k3s_traces, Kubernetes events/objects -> k3s_events (exporter `stream-name` headers, set in
# scripts/openobserve.sh next to the credentials). OpenObserve names metric streams after the
# metric, so transform/k3s_prefix renames every metric to k3s_<name>.
#
# Idle trimming (operator decision 2026-10-04): every collection/scrape interval is 60s instead of
# the chart's 30s. gateway.receivers.prometheus is the chart 0.5.0 scrape list with only
# scrape_interval changed (Helm replaces lists, so it has to be complete).
# Gateway watches only events/pods/nodes/deployments (chart: 28 object kinds) to cut its memory.
#
# Metrics allowlist (2026-10-09): OpenObserve stores one stream per metric name, and 659 k3s_*
# streams (go_* runtime, coredns, scheduler, controller-manager, collector self-metrics, histogram
# buckets, duplicate ate_* via Prometheus) caused heavy small-file churn there. filter/allowlist in
# both metric pipelines keeps only what we use; the scrape jobs whose output was all dropped are gone.
# Substrate's per-actor checkpoint/lifecycle histograms are dropped too (~97 % of remaining rows).
k8sCluster: kube-ax
agent:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 200
      spike_limit_mib: 50
    transform/k3s_prefix:
      metric_statements:
      - context: metric
        statements:
        - set(name, Concat(["k3s_", name], ""))
    filter/allowlist: &id001
      error_mode: ignore
      metrics:
        metric:
        - not IsMatch(name, "^(system[.]cpu[.]load_average[.](1m|5m|15m)|system[.]cpu[.]utilization|system[.]memory[.](usage|utilization)|system[.]filesystem[.]usage|system[.]disk[.]io|system[.]network[.]io|k8s[.]node[.](cpu[.]usage|memory[.](working_set|available)|filesystem[.](available|capacity|usage)|network[.]io)|k8s[.]pod[.](cpu[.]usage|memory[.]working_set|network[.]io)|kube_(pod_status_phase|pod_container_status_restarts_total|pod_container_status_waiting_reason|pod_container_status_terminated_reason|node_status_condition|deployment_status_replicas_(available|unavailable)|daemonset_status_number_unavailable|pod_container_resource_(requests|limits))|ate[.](actor[.](stats[.].*|crashes)|imagecache[.].*|workerpool[.].*|scheduler[.]assignment[.]duration)|traces_service_graph_request_(total|failed_total))$")
  service:
    pipelines:
      logs:
        exporters:
        - otlphttp/openobserve_logs
      metrics:
        processors:
        - memory_limiter
        - filter/allowlist
        - resourcedetection
        - attributes
        - k8sattributes
        - transform/k3s_prefix
        - batch
  receivers:
    hostmetrics:
      collection_interval: 60s
    kubeletstats:
      collection_interval: 60s
gateway:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 384Mi
  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 300
      spike_limit_mib: 75
    transform/k3s_prefix:
      metric_statements:
      - context: metric
        statements:
        - set(name, Concat(["k3s_", name], ""))
    filter/allowlist: *id001
  service:
    pipelines:
      metrics:
        processors:
        - memory_limiter
        - filter/allowlist
        - resourcedetection
        - attributes
        - k8sattributes
        - transform/k3s_prefix
        - batch
      traces:
        exporters:
        - otlphttp/openobserve_traces
        - servicegraph
      logs/k8s_events:
        receivers:
        - k8sobjects/events
        - k8sobjects/pods
        - k8sobjects/nodes
        - k8sobjects/deployments
  receivers:
    prometheus:
      config:
        scrape_configs:
        - job_name: kube-state-metrics
          scrape_interval: 60s
          scrape_timeout: 10s
          static_configs:
          - targets:
            - kube-state-metrics.kube-system.svc.cluster.local:8080
          metric_relabel_configs:
          - action: keep
            regex: kube_(pod_status_phase|pod_container_status_restarts_total|pod_container_status_waiting_reason|pod_container_status_terminated_reason|node_status_condition|deployment_status_replicas_(available|unavailable)|daemonset_status_number_unavailable|pod_container_resource_(requests|limits))
            source_labels:
            - __name__
