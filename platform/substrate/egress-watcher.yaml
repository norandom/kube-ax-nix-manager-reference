# Attaches an egress policy to every new actor in atespace default (tools/egress-watcher), chosen
# by name prefix from the ConfigMap egress-watcher-routes (platform/substrate/egress-routes/*.json,
# created by scripts/platform.sh; see the README there). Substrate has no API authorization, so
# this identity has full Substrate access; it lives in ate-system, operator-owned, and does only
# this. Create-only.
# ${WATCHER_IMAGE} is filled in by scripts/platform.sh (step: egress).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: egress-watcher
  namespace: ate-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-watcher
  namespace: ate-system
  labels: {app: egress-watcher}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: egress-watcher}
  template:
    metadata:
      labels: {app: egress-watcher}
    spec:
      serviceAccountName: egress-watcher
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: watcher
          image: ${WATCHER_IMAGE}
          args:
            - --atespace=default
            - --interval=1s
          ports:
            - {name: health, containerPort: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: ate-token, mountPath: /var/run/secrets/ateapi, readOnly: true}
            - {name: servicedns-ca, mountPath: /run/servicedns-ca, readOnly: true}
            - {name: policy, mountPath: /etc/egress-watcher, readOnly: true}
      volumes:
        - name: ate-token
          projected:
            sources:
              - serviceAccountToken: {audience: api.ate-system.svc, expirationSeconds: 3600, path: token}
        - name: servicedns-ca
          projected:
            sources:
              - clusterTrustBundle:
                  signerName: servicedns.podcert.ate.dev/identity
                  labelSelector:
                    matchLabels: {podcert.ate.dev/canarying: live}
                  path: trust-bundle.pem
        - name: policy
          configMap: {name: egress-watcher-routes}
