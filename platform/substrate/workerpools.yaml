# One gVisor WorkerPool per node (Requirement 18.4). Pools share the label `pool: ax-compute`;
# AX's actor templates have no workerSelector, so every gVisor pool is eligible and Substrate's
# uniform-random scheduler spreads tasks across both nodes.
#
# Sizing (operator decision 2026-10-04): ONE engine per worker. ateom's --max-actors default is 1
# in our Substrate patch, so a busy worker is skipped and the next task lands on the other node; a
# task submitted while every worker is busy fails in AX v0.3.1 (no queueing), so the dispatcher keeps
# <= one engine per worker in flight. Engine JVM (~2.3-2.5 GiB incl. gVisor):
#   -Xms1700m -Xmx1700m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=128m
#   -XX:MaxDirectMemorySize=256m -Xss512k -XX:ActiveProcessorCount=2 -XX:+UseG1GC
# 3 GiB per worker (request = limit) leaves ~2.8-3 GiB per node for Gitea CI, which runs at lower
# priority (batch-low) and waits when AX needs the room.
# ${WORKER_IMAGE} and ${SUBSTRATE_VERSION} are filled in by scripts/platform.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: ax-workers
---
# Above Gitea CI (batch-low, 1000): AX workers preempt CI pods when they need room.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ax-workers
value: 5000
preemptionPolicy: PreemptLowerPriority
description: AX/Substrate worker pods; CI waits for them.
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: compute-kube-01
  namespace: ax-workers
  labels: {pool: ax-compute, node: kube-01}
spec:
  replicas: 1
  sandboxClass: gvisor
  workerImage: ${WORKER_IMAGE}
  template:
    nodeSelector:
      kubernetes.io/hostname: kube-01
      ate.dev/substrate-version: "${SUBSTRATE_VERSION}"
    priorityClassName: ax-workers
    resources:
      requests: {cpu: "1500m", memory: 3Gi}
      limits: {cpu: "3", memory: 3Gi}
---
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: compute-kube-02
  namespace: ax-workers
  labels: {pool: ax-compute, node: kube-02}
spec:
  replicas: 1
  sandboxClass: gvisor
  workerImage: ${WORKER_IMAGE}
  template:
    nodeSelector:
      kubernetes.io/hostname: kube-02
      ate.dev/substrate-version: "${SUBSTRATE_VERSION}"
    priorityClassName: ax-workers
    resources:
      requests: {cpu: "1500m", memory: 3Gi}
      limits: {cpu: "3", memory: 3Gi}
